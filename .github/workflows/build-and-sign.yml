name: Build and Sign Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --clean --name "SeePDBTKAssistant" --hidden-import="pynput.keyboard._win32" --hidden-import="pynput.mouse._win32" --hidden-import="pyttsx3.drivers" --hidden-import="pyttsx3.drivers.sapi5" --hidden-import="google.genai" --hidden-import="google.genai.types" --hidden-import="PyQt6.QtSvg" --add-data "btk_cache.json;." main.py

      - name: Prepare artifact for SignPath
        shell: bash
        run: |
          mkdir -p to_sign
          cp dist/SeePDBTKAssistant.exe to_sign/
          cd to_sign && zip -r ../SeePDBTKAssistant.zip SeePDBTKAssistant.exe

      - name: Submit to SignPath for Signing
        id: sign
        uses: signpath/github-action-submit-signing-request@v1
        continue-on-error: true
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'seepd-btk-assistant'
          signing-policy-slug: 'release-signing'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          wait-for-completion: true
          output-artifact-directory: 'signed_output'

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/SeePDBTKAssistant.exe
            config.example.json
