name: Build and Sign Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --clean --name "SeePDBTKAssistant" --hidden-import="pynput.keyboard._win32" --hidden-import="pynput.mouse._win32" --hidden-import="pyttsx3.drivers" --hidden-import="pyttsx3.drivers.sapi5" --hidden-import="google.genai" --hidden-import="google.genai.types" --hidden-import="PyQt6.QtSvg" --add-data "btk_cache.json;." --exclude-module torch --exclude-module torchvision --exclude-module scipy --exclude-module pandas --exclude-module numba --exclude-module onnxruntime --exclude-module cv2 --exclude-module matplotlib main.py

      - name: Prepare artifact for SignPath
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path to_sign
          Copy-Item dist/SeePDBTKAssistant.exe -Destination to_sign/
          Compress-Archive -Path to_sign/SeePDBTKAssistant.exe -DestinationPath SeePDBTKAssistant.zip -Force

      - name: Submit to SignPath for Signing
        id: sign
        uses: signpath/github-action-submit-signing-request@v1
        continue-on-error: true
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'seepd-btk-assistant'
          signing-policy-slug: 'release-signing'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          wait-for-completion: true
          output-artifact-directory: 'signed_output'

      - name: Pick binary to release
        shell: pwsh
        run: |
          if (Test-Path signed_output/SeePDBTKAssistant.exe) {
            Write-Host "Using signed binary..."
            Copy-Item signed_output/SeePDBTKAssistant.exe -Destination dist/SeePDBTKAssistant.exe -Force
          } else {
            Write-Host "SignPath not ready or skipped, releasing build binary directly."
          }

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SeePD BTK Assistant ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SeePDBTKAssistant.exe
            config.example.json
